<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yellow Zone | لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="brand">YELLOW <span>ZONE</span></div><button id="logout" class="danger">تسجيل الخروج</button></header>
<main class="wrap">
<section id="loginView" class="panel login">
  <p class="eyebrow">ADMIN</p><h1>لوحة إدارة Yellow Zone</h1>
  <p>سجّل الدخول بحساب الإدارة في Supabase.</p>
  <form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>تسجيل الدخول</button><p id="loginMsg"></p></form>
</section>

<section id="dashboard" hidden>
  <div class="head"><div><p class="eyebrow">DASHBOARD</p><h1>لوحة التحكم</h1></div><div id="userEmail"></div></div>
  <div class="stats"><div><span>الحجوزات</span><strong id="statBookings">0</strong></div><div><span>الجديدة</span><strong id="statNew">0</strong></div><div><span>الأشخاص</span><strong id="statPeople">0</strong></div></div>

  <div class="panel"><div class="panel-head"><h2>الحجوزات</h2><button id="refreshBookings">تحديث</button></div><div class="table-wrap"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الجوال</th><th>التاريخ</th><th>الأشخاص</th><th>الباقة</th><th>الحالة</th><th></th></tr></thead><tbody id="bookingsBody"></tbody></table></div></div>

  <div class="panel"><div class="panel-head"><h2>الباقات والأسعار</h2><button id="newOffer">إضافة باقة</button></div><div id="offersAdmin"></div></div>

  <div class="panel"><div class="panel-head"><h2>الإعلانات</h2><button id="newAnnouncement">إضافة إعلان</button></div><div id="announcementsAdmin"></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/config.js"></script>
<script src="app.js"></script>
</body></html>
